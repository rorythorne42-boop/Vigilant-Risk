<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Rory Thorne — Vigilant Risk</title>
  <meta name="description" content="Rory Thorne, Director at Vigilant Risk Ltd. Close Protection, Risk Analysis &amp; Investigations.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e8dfc8;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #111;
      border: 1px solid #3a2c14;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.8);
    }

    /* Header */
    .card-header {
      background: #0a0a0a;
      padding: 36px 24px 24px;
      text-align: center;
      border-bottom: 1px solid #2a1e0a;
    }

    .logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      display: block;
    }

    .company-name {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #8a6a2a;
      margin-bottom: 14px;
    }

    .name {
      font-size: 26px;
      font-weight: normal;
      color: #e8dfc8;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .title {
      font-size: 13px;
      color: #8a7a5a;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Tagline */
    .tagline {
      padding: 18px 24px;
      text-align: center;
      border-bottom: 1px solid #1e1a12;
      font-size: 12px;
      letter-spacing: 0.18em;
      color: #c8a84a;
      text-transform: uppercase;
    }

    /* Contact links */
    .contacts {
      padding: 8px 0;
      border-bottom: 1px solid #1e1a12;
    }

    .contact-link {
      display: flex;
      align-items: center;
      padding: 16px 24px;
      text-decoration: none;
      color: #e8dfc8;
      transition: background 0.15s;
      gap: 16px;
      border-bottom: 1px solid #1a1710;
    }

    .contact-link:last-child {
      border-bottom: none;
    }

    .contact-link:hover, .contact-link:active {
      background: #1a1610;
    }

    .contact-icon {
      width: 36px;
      height: 36px;
      border: 1px solid #3a2c14;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #c8a84a;
    }

    .contact-icon svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .contact-text {
      flex: 1;
    }

    .contact-label {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #6a5a3a;
      margin-bottom: 3px;
    }

    .contact-value {
      font-size: 14px;
      color: #d8cdb0;
    }

    /* Save contact button */
    .save-btn {
      display: block;
      margin: 20px 24px;
      padding: 14px;
      background: transparent;
      border: 1px solid #c8a84a;
      color: #c8a84a;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
      font-family: 'Georgia', serif;
    }

    .save-btn:hover, .save-btn:active {
      background: #c8a84a;
      color: #0a0a0a;
    }

    /* Footer */
    .card-footer {
      padding: 16px 24px;
      text-align: center;
      border-top: 1px solid #1e1a12;
    }

    .footer-text {
      font-size: 10px;
      color: #3a3020;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>
